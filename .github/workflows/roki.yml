# Tedenski pregled rokov (issue #407): kar poteče tiho, se zgodi ob najslabšem času (potekel TLS certifikat, domena, poštni paket, disk baze).
#
# Kaj preveri (vse samo BRANJE javnih virov):
#   1. TLS notAfter za outly.si in outly-backend-roy3.onrender.com (openssl s_client). Certifikata se obnavljata sama (Cloudflare, Render;
#      zivljenjska doba ~90 dni, obnova ~30 dni pred potekom), zato je prag TU 14 in 7 dni, ne 60/30/7: pri 60 dneh bi alarm dobil vsak cikel.
#   2. Potek domene outly.si prek RDAP. Register .si (Arnes) ima RDAP: IANA bootstrap https://data.iana.org/rdap/dns.json kaze za "si" na
#      https://rdap.register.si/ (izmerjeno 8. 11. 2026; GET /domain/outly.si vrne dogodek "expiration"). Bootstrap se prebere vsakic;
#      ce odpove, velja ta naslov; ce odpove tudi RDAP, se poskusi `whois`; ce datuma ni, je to opozorilo "neznano", ne napaka.
#   3. GET /healthz/baza (samo {"ok":true|false}, brez odstotka): 503 ali ok=false v DVEH krogih (60 s narazen) = alarm
#      (issue martin, fiksen marker + reset ob okrevanju), 404 in drugo = opozorilo. 503 je lahko tudi zasicen pool, zato en krog ne zadostuje.
#   4. Fiksne datume iz _orodja/roki.json (javna datoteka, brez skrivnosti). Vnos z "datum": null pomeni "datum ni znan": ob prvem zagonu se odpre
#      EN issue "Roki: manjkajo datumi" (oznaka martin) s seznamom.
# Prag za datume: 60, 30, 7 dni (TLS: 14, 7). Alarm = issue z oznako `martin` + ntfy (secret NTFY_TOPIC), BREZ podvajanja: issue z istim
# naslovom (odprt ali zaprt v zadnjih 30 dneh) z ze objavljenim markerjem (prag + datum poteka) = nic; odprt brez markerja dobi komentar;
# sicer nov issue. Disk: ob okrevanju (200 ok) se na issue zapise marker -reset, zato naslednji alarm ni utisan. Alarm sam zagona NE obarva rdece (to ni izpad produkcije).
# Rdec zagon = napaka pregleda samega (npr. issuea ni mogoce ustvariti, roki.json pokvarjen); ping Healthchecks se takrat ne poslje.
#
# Mrtev cloveka drzalo: ce je nastavljen secret HC_URL_ROKI, zadnji korak uspesnega zagona pingne Healthchecks (priporocilo: Period 8 days,
# Grace 2 days). Brez njega samo ::warning::, workflow ostane zelen.
# Repo je JAVEN: v dnevnik gredo imena rokov, dnevi do poteka in status /healthz/baza; nikoli skrivnosti ali telesa odgovorov.
name: Roki

on:
  schedule:
    - cron: "17 14 * * 1"   # ponedeljek 14:17 UTC (izven 06-09 UTC, ko GitHub zamuja; minuta ni 0/30)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  roki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Preglej roke
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -u
          REPO="$GITHUB_REPOSITORY"
          BACKEND="https://outly-backend-roy3.onrender.com"
          TELO_FILE="$RUNNER_TEMP/roki-telo.md"
          NOVO=""      # vrstice za ntfy: samo kar je bilo zdaj res NOVO objavljeno
          NAPAKA=0     # 1 = pregled sam ni uspel (issuea ni mogoce ustvariti ...) -> rdec zagon
          MANJKA=""    # roki brez datuma

          vrstice() { printf '%s\n' "$@"; }   # vsak argument = ena vrstica (besedila v YAML-u ne smejo zaceti v stolpcu 0)

          # kandidati NASLOV OZNAKA: stevilke issueov z natancno tem naslovom, ki so ODPRTI ali ZAPRTI v zadnjih 30 dneh (najnovejsi prvi).
          # Vrne 1, ce seznama ni mogoce prebrati (klicatelj tedaj NE odpre novega issuea: lahko bi ze obstajal).
          kandidati() {
            local seznam meja
            meja=$(date -u -d '30 days ago' +%FT%TZ)
            seznam=$(gh issue list --repo "$REPO" --state all --label "$2" --limit 200 --json number,title,state,closedAt) || return 1
            jq -r --arg t "$1" --arg m "$meja" '.[] | select(.title == $t) | select(.state == "OPEN" or ((.closedAt // "") >= $m)) | "\(.number) \(.state)"' <<<"$seznam" || return 1
          }
          # Zadnji marker (MARKER ali MARKER-reset) v telesu in komentarjih issuea: objavljeno = zadnji je MARKER (reset ga "izprazni").
          objavljeno() { # stevilka marker
            local vse zadnji
            vse=$(gh issue view "$1" --repo "$REPO" --json body,comments --jq '[.body, (.comments[].body)] | join("\n")') || return 2
            zadnji=$(grep -oE "<!-- $2(-reset)? -->" <<<"$vse" | tail -1)
            [ "$zadnji" = "<!-- $2 -->" ]
          }

          # obvesti NASLOV OZNAKA MARKER TELO: issue (ali komentar na odprtega z istim naslovom), brez podvajanja po MARKERju.
          # Ze objavljeno (tudi v issueu, ZAPRTEM v zadnjih 30 dneh) -> nic. Datum poteka je v MARKERju, nov datum = nov alarm.
          obvesti() {
            local naslov="$1" oznaka="$2" marker="$3" telo="$4" kand st stanje odprt="" r
            printf '%s\n\n<!-- %s -->\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$telo" "$marker" > "$TELO_FILE"
            if ! kand=$(kandidati "$naslov" "$oznaka"); then
              echo "::error::Seznama issueov ni mogoce prebrati - '$naslov' NI objavljen, novega issuea ne odpiram (lahko ze obstaja)."; NAPAKA=1; return
            fi
            while read -r st stanje; do
              [ -n "$st" ] || continue
              objavljeno "$st" "$marker"; r=$?
              if [ "$r" = 0 ]; then echo "Ze objavljeno (#$st, $marker) - nic novega."; return; fi
              if [ "$r" = 2 ]; then echo "::error::Issuea #$st ni mogoce prebrati - '$naslov' NI objavljen."; NAPAKA=1; return; fi
              if [ "$stanje" = "OPEN" ] && [ -z "$odprt" ]; then odprt="$st"; fi
            done <<<"$kand"
            if [ -n "$odprt" ]; then
              if gh issue comment "$odprt" --repo "$REPO" --body-file "$TELO_FILE" >/dev/null; then
                echo "Komentar na #$odprt ($marker)"; NOVO+="$naslov"$'\n'
              else
                echo "::error::Komentarja na #$odprt ni mogoce dodati."; NAPAKA=1
              fi
            elif gh issue create --repo "$REPO" --title "$naslov" --label "$oznaka" --body-file "$TELO_FILE" >/dev/null; then
              echo "Issue ustvarjen: $naslov"; NOVO+="$naslov"$'\n'
            else
              echo "::error::Issuea '$naslov' ni mogoce ustvariti (oznaka $oznaka obstaja?)."; NAPAKA=1
            fi
          }

          # okrevanje NASLOV OZNAKA MARKER: na odprtem / pred kratkim zaprtem issueju z objavljenim MARKERjem zapise MARKER-reset,
          # da naslednji alarm ni utisan (po okrevanju sme odpreti nov issue ali komentar).
          okrevanje() {
            local kand st stanje
            kand=$(kandidati "$1" "$2") || { echo "::warning::Okrevanja ni mogoce zabeleziti (seznam issueov)."; return; }
            while read -r st stanje; do
              [ -n "$st" ] || continue
              if objavljeno "$st" "$3"; then
                printf 'Okrevanje: meritev je spet v redu.\n\n<!-- %s-reset -->\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$3" > "$TELO_FILE"
                gh issue comment "$st" --repo "$REPO" --body-file "$TELO_FILE" >/dev/null && echo "Okrevanje zabelezeno na #$st."
              fi
            done <<<"$kand"
          }

          # preveri_rok IME DATUM KAJ_PADE PRAG...   (pragi padajoce; alarm za najmanjsi prag, ki je dosezen; potekel = prag 0)
          preveri_rok() {
            local ime="$1" datum="$2" kaj="$3" cilj sek dni prag stopnja="" OPIS
            shift 3
            cilj=$(date -u -d "$datum" +%s 2>/dev/null) || { echo "::warning::Rok '$ime': datum '$datum' ni veljaven."; return; }
            sek=$(( cilj - $(date -u +%s) ))
            # Zaokrozevanje: potekel pred < 24 h bi s celoštevilskim deljenjem dal 0 dni; vsak pretekli rok je najmanj -1 dan (»potekel«).
            if [ "$sek" -lt 0 ]; then dni=$(( -((-sek + 86399) / 86400) )); else dni=$(( sek / 86400 )); fi
            if [ "$dni" -lt 0 ]; then stopnja=0; else
              for prag in "$@"; do [ "$dni" -le "$prag" ] && stopnja="$prag"; done
            fi
            if [ -z "$stopnja" ]; then echo "OK  $ime: $dni dni do $datum"; return; fi
            echo "ROK $ime: $dni dni do $datum (prag $stopnja)"
            if [ "$dni" -lt 0 ]; then OPIS="**$ime** je potekel **$datum** (pred $(( -dni )) dnevi)."
            else OPIS="**$ime** poteče **$datum** (čez $dni dni; prag $stopnja dni)."; fi
            obvesti "Rok: $ime" martin "prag-$stopnja-$datum" "$(vrstice \
              "$OPIS" "" \
              "Kaj pade, če poteče: $kaj" "" "Zagon: $RUN_URL")"
          }

          # --- 1) TLS ---
          for H in outly.si outly-backend-roy3.onrender.com; do
            ZAPIS=$(echo | timeout 25 openssl s_client -connect "$H:443" -servername "$H" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null) || ZAPIS=""
            KON="${ZAPIS#notAfter=}"
            DATUM=""
            [ -n "$KON" ] && DATUM=$(date -u -d "$KON" +%F 2>/dev/null)
            if [ -z "$DATUM" ]; then echo "::warning::TLS $H: notAfter ni mogoce prebrati (neznano)."; continue; fi
            preveri_rok "TLS certifikat $H" "$DATUM" "Brskalniki in aplikacija javijo napako certifikata; stran oziroma API je za uporabnike nedosegljiv. Obnova je samodejna - rok pomeni, da se je ustavila." 14 7
          done

          # --- 2) Domena outly.si (RDAP, rezerva whois) ---
          BOOT=$(curl -sS --max-time 30 "https://data.iana.org/rdap/dns.json" 2>/dev/null) || BOOT=""
          RDAP=$(jq -r '[.services[]? | select(.[0] | index("si")) | .[1][0]][0] // empty' <<<"$BOOT" 2>/dev/null || true)
          [[ "$RDAP" =~ ^https://[A-Za-z0-9./-]+$ ]] || RDAP="https://rdap.register.si/"
          RDAP="${RDAP%/}"
          ODG=$(curl -sSL --max-time 30 -H 'Accept: application/rdap+json' "$RDAP/domain/outly.si" 2>/dev/null) || ODG=""
          DOMENA=$(jq -r '[.events[]? | select(.eventAction == "expiration") | .eventDate][0] // empty' <<<"$ODG" 2>/dev/null | cut -c1-10 || true)
          if ! [[ "$DOMENA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            DOMENA=""
            if command -v whois >/dev/null 2>&1; then
              W=$(timeout 30 whois outly.si 2>/dev/null | grep -iE '^(expire|expires|expiration|registry expiry)[a-z ]*:' | head -1 || true)
              if   [[ "$W" =~ ([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then DOMENA="${BASH_REMATCH[1]}"
              elif [[ "$W" =~ ([0-9]{2})\.([0-9]{2})\.([0-9]{4}) ]]; then DOMENA="${BASH_REMATCH[3]}-${BASH_REMATCH[2]}-${BASH_REMATCH[1]}"; fi
            fi
          fi
          if [ -z "$DOMENA" ]; then
            echo "::warning::Potek domene outly.si: neznano (RDAP in whois datuma nista vrnila)."
          else
            preveri_rok "Domena outly.si" "$DOMENA" "Spletna stran, povezave v aplikaciji, e-poštni naslovi na outly.si in prijava prek maila nehajo delovati." 60 30 7
          fi

          # --- 3) Disk baze (javna pot vrne SAMO {"ok":true|false}: 200/503, brez odstotka) ---
          # 503 je lahko disk ALI zasicen pool ob navali: curl 3x ponovi (20 s), alarm sele, ce je 503/ok:false tudi v DRUGEM krogu po 60 s.
          disk_krog() {
            local odg
            odg=$(curl -sS --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors -w '\n%{http_code}' "$BACKEND/healthz/baza" 2>/dev/null) || odg=$'\n000'
            STATUS="${odg##*$'\n'}"; TELO="${odg%$'\n'*}"
            OKPOLJE=$(jq -r 'if .ok == true then "true" elif .ok == false then "false" else empty end' <<<"$TELO" 2>/dev/null || true)
          }
          disk_slab() { [ "$STATUS" = "503" ] || [ "$OKPOLJE" = "false" ]; }
          disk_krog
          if disk_slab; then
            echo "Disk: prvi krog status $STATUS, ponovitev cez 60 s"
            sleep 60
            disk_krog
          fi
          if [ "$STATUS" = "404" ]; then
            echo "::warning::GET /healthz/baza vrne 404 (pot se ni v zivo) - disk ni preverjen."
          elif disk_slab; then
            echo "DISK /healthz/baza: status $STATUS, ok=${OKPOLJE:-?} (tudi v drugem krogu)"
            obvesti "Disk baze outly-db nad mejo ali meritev ni uspela" martin "disk-alarm" "$(vrstice \
              "Javna pot \`/healthz/baza\` je v dveh krogih (60 s narazen) vrnila **$STATUS** (\`ok\`: ${OKPOLJE:-?}): disk baze **outly-db** je nad mejo ali meritev ni uspela. Poglej opozorilo \`baza_disk\` v admin panelu." "" \
              "Ko zmanjka prostora, baza preneha pisati: nakupi, prijave in sken na vratih padejo. Povečanje diska na Renderju stane denar in zahteva Martinov DA (agent pripravi znesek na mesec)." "" "Zagon: $RUN_URL")"
          elif [ "$STATUS" = "200" ] && [ "$OKPOLJE" = "true" ]; then
            echo "OK  /healthz/baza (200, ok=true)"
            okrevanje "Disk baze outly-db nad mejo ali meritev ni uspela" martin "disk-alarm"
          else
            echo "::warning::/healthz/baza: nepricakovan odgovor (status $STATUS) - disk ni preverjen."
          fi

          # --- 4) Fiksni roki iz _orodja/roki.json ---
          jq -e '.roki | type == "array"' _orodja/roki.json >/dev/null || { echo "::error::_orodja/roki.json je pokvarjen (pricakovan objekt z seznamom 'roki')."; exit 1; }
          while IFS= read -r R; do
            IME=$(jq -r '.ime' <<<"$R"); DATUM=$(jq -r '.datum // ""' <<<"$R"); KAJ=$(jq -r '.kaj_pade // ""' <<<"$R")
            if [ -z "$DATUM" ]; then MANJKA+="- $IME"$'\n'; continue; fi
            preveri_rok "$IME" "$DATUM" "$KAJ" 60 30 7
          done < <(jq -c '.roki[]' _orodja/roki.json)
          if [ -n "$MANJKA" ]; then
            echo "::warning::Roki brez datuma: $(printf '%s' "$MANJKA" | wc -l) (seznam v issueu 'Roki: manjkajo datumi')."
            # shellcheck disable=SC2016  # povratni narekovaji so markdown, ne ukazna zamenjava
            obvesti "Roki: manjkajo datumi" martin "manjkajo" "$(vrstice \
              'V `_orodja/roki.json` so roki z `"datum": null` (datum ni znan). Martin: poišči datum (račun, e-pošta ponudnika) in ga vpiši v datoteko (PR; datoteka je javna, brez skrivnosti):' "" \
              "$MANJKA" "Dokler datuma ni, ga nihče ne spremlja - izteče lahko tiho." "" "Zagon: $RUN_URL")"
          fi

          # --- ntfy: samo za kar je bilo zdaj res NOVO ---
          if [ -n "$NOVO" ]; then
            if [ -z "$TOPIC" ]; then echo "NTFY_TOPIC ni nastavljen - push preskocen"
            else
              curl -sS --max-time 20 -H "Title: Outly roki" -H "Priority: default" -H "Tags: calendar" -H "Click: $RUN_URL" -d "$NOVO" "https://ntfy.sh/$TOPIC" >/dev/null \
                && echo "Push poslan." || echo "::warning::ntfy push ni uspel."
            fi
          fi
          rm -f "$TELO_FILE"
          [ "$NAPAKA" = 0 ] || exit 1

      - name: Ping Healthchecks.io (mrtev cloveka drzalo)
        if: success()
        env:
          HC_URL: ${{ secrets.HC_URL_ROKI }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "::warning::HC_URL_ROKI ni nastavljen - ping preskocen (neobvezno, glej komentar na vrhu workflowa)."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$HC_URL" >/dev/null && echo "Ping poslan." \
            || echo "::warning::Healthchecks ping ni uspel - to NI napaka produkcije (preveri secret HC_URL_ROKI)."
