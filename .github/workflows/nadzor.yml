# Nadzor produkcije: vsakih 15 minut preveri backend, spletno stran in Supabase Auth.
# Ob napaki: workflow je rdec (GitHub poslje mail lastniku) IN push obvestilo na telefon
# prek ntfy.sh na kanal iz secreta NTFY_TOPIC (brez racuna: v aplikaciji ntfy se narocis na kanal).
# Rocni zagon z "test=true" poslje testno obvestilo, da preveris, ali push pride.
# Ob PRAVI napaki (ne pri testu) poklice se routine "Popravljalec" (Claude Code, API sprozilec;
# secrets ROUTINE_FIRE_URL + ROUTINE_FIRE_TOKEN), ki napako razisce in popravi ali reverta.
name: Nadzor produkcije

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "true = testni push; routine = testni push + testni zagon routine Popravljalec; false = nic"
        default: "false"

permissions:
  contents: read

jobs:
  nadzor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preveri produkcijo
        id: preveri
        shell: bash
        run: |
          set -u
          NAPAKE=""
          preveri() { # ime url pricakovan_status [niz_v_odgovoru] [dodatna_glava]
            local ime="$1" url="$2" pricakovan="$3" niz="${4:-}" glava="${5:-X-Nadzor: outly}"
            local telo status
            telo=$(curl -sS --max-time 25 --retry 3 --retry-delay 10 --retry-all-errors -H "$glava" -w '\n%{http_code}' "$url" 2>/dev/null) || telo=$'\n000'
            status="${telo##*$'\n'}"
            telo="${telo%$'\n'*}"
            if [ "$status" != "$pricakovan" ]; then
              NAPAKE+="$ime: status $status (pricakovan $pricakovan)"$'\n'
            elif [ -n "$niz" ] && ! grep -q -- "$niz" <<<"$telo"; then
              NAPAKE+="$ime: odgovor brez '$niz'"$'\n'
            else
              echo "OK  $ime ($status)"
            fi
          }
          preveri "backend /clubs"   "https://outly-backend-roy3.onrender.com/clubs"   200 '"id"'
          preveri "backend /events"  "https://outly-backend-roy3.onrender.com/events"  200
          preveri "backend admin"    "https://outly-backend-roy3.onrender.com/admin/"  200
          preveri "backend auth"     "https://outly-backend-roy3.onrender.com/me/invites" 401
          preveri "outly.si"         "https://outly.si/"                                200 'Outly'
          preveri "outly.si /terms"  "https://outly.si/terms"                           200
          # javni (publishable) kljuc, isti kot v kodi aplikacije in spletne strani
          preveri "supabase auth"    "https://zbewqcxnvrwebxonvebx.supabase.co/auth/v1/health" 200 '' "apikey: sb_publishable_NzgXZhG7RGs0mZMjGYtyig_XfOvepXS"
          TEST="${{ github.event.inputs.test || 'false' }}"
          if [ "$TEST" = "true" ]; then
            NAPAKE+="TESTNO OBVESTILO - vse je v redu, to je samo preizkus."$'\n'
          elif [ "$TEST" = "routine" ]; then
            NAPAKE+="TESTNI ALARM (simulacija, produkcija je v redu) - Popravljalec: samo preveri stanje in poslji porocilo, nic ne spreminjaj."$'\n'
          fi
          {
            echo "napake<<EOF"
            printf '%s' "$NAPAKE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$NAPAKE" ] && [ "$TEST" = "false" ]; then
            echo "::error::$NAPAKE"
            exit 1
          fi

      - name: Push obvestilo na telefon (ntfy)
        if: always() && steps.preveri.outputs.napake != ''
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          NAPAKE: ${{ steps.preveri.outputs.napake }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOPIC" ]; then echo "NTFY_TOPIC ni nastavljen - push preskocen"; exit 0; fi
          curl -sS --max-time 20 \
            -H "Title: Outly produkcija" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -H "Click: $RUN_URL" \
            -d "$NAPAKE" \
            "https://ntfy.sh/$TOPIC" >/dev/null && echo "Push poslan."

      - name: Sprozi routine Popravljalec (Claude Code)
        if: always() && steps.preveri.outputs.napake != '' && github.event.inputs.test != 'true'
        env:
          FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          NAPAKE: ${{ steps.preveri.outputs.napake }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then echo "ROUTINE_FIRE_* ni nastavljen - routine preskocena"; exit 0; fi
          TEXT=$(printf 'Alarm nadzora produkcije %s (%s)\n%s' "$(date -u +%Y-%m-%dT%H:%MZ)" "$RUN_URL" "$NAPAKE")
          BODY=$(jq -cn --arg t "$TEXT" '{text:$t}')
          ODG=$(curl -sS --max-time 30 -w '\n%{http_code}' -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$BODY") || ODG=$'\n000'
          STATUS="${ODG##*$'\n'}"
          echo "Routine odgovor: $STATUS"
          echo "${ODG%$'\n'*}" | sed -E 's/"claude_code_session_url":"([^"]*)"/\nSeja: \1\n/' | head -c 600
          [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || echo "::warning::Routine se ni sprozila (HTTP $STATUS)"

      # Mrtev cloveka drzalo: ce ta workflow sploh NE stece (GitHub Actions v izpadu,
      # onemogocen cron po 60 dneh nedejavnosti, pokvarjen YAML), zgoraj nihce ne opozori —
      # rdeca lucka rabi zagon. Healthchecks.io obrne logiko: ce pinga ni v 15 min + 20 min
      # odloga, javi ON.
      #
      # Pogoj je namenoma "napake == ''", ne samo success(): pri rocnem zagonu z test=true
      # ali test=routine korak "Preveri produkcijo" NE pade, tudi ce je produkcija res podrta
      # (exit 1 je pogojen s TEST=false). Z golim success() bi tak zagon poslal ping "vse OK"
      # sredi resnicnega izpada in Healthchecks bi molcal. Prazen "napake" pomeni: vseh sedem
      # preverb je bilo zelenih in to ni bil testni zagon.
      - name: Ping Healthchecks.io (mrtev cloveka drzalo)
        if: success() && steps.preveri.outputs.napake == ''
        env:
          HC_URL: ${{ secrets.HC_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "::warning::HC_URL ni nastavljen - ping preskocen (glej docs/ARCHITECTURE.md, razdelek Healthchecks.io)."
            exit 0
          fi
          # Brez "|| true" bi izpad Healthchecks.io (DNS, 5xx, pretecen URL) obarval CEL nadzor
          # rdece in poslal Martinu mail, ceprav je produkcija zdrava - tocno vzorec laznega
          # alarma iz docs/INCIDENTI.md. Manjkajoc ping javi Healthchecks sam, to je njegov posel.
          curl -fsS -m 10 --retry 3 "$HC_URL" && echo "Ping poslan." \
            || echo "::warning::Healthchecks ping ni uspel - to NI napaka produkcije (preveri secret HC_URL)."
