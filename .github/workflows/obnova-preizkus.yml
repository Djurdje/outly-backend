# Mesecni POLNI preizkus obnove shranjene kopije (issue #88). Dopolnjuje dnevni preizkus v kopija.yml.
#
# Dnevni zagon obnovi izvoz PRED sifriranjem in kopijo iz R2 odsifrira ter primerja z izvozom. Ta workflow vzame kopijo, kot LEZI v R2
# (najnovejsa ali ta, ki jo izberes), jo odsifrira z BACKUP_GESLO (geslo ne zapusti GitHuba), obnovi v PRAZNO bazo v service containerju
# postgres:16 in primerja stevila vrstic po tabelah in seznam migracij - torej dokaz, da je to, kar ima Martin v R2, res obnovljivo.
# Brez Martina. Ob napaki: rdec zagon + push (ntfy) + issue (oznaka agent).
#
# Rocni zagon (Actions > Run workflow, samo veja main zaradi environmenta »kopije«): polje `kopija` = ime ali celoten kljuc zelene kopije
# (npr. outly-db-2026-10-02-r123456789-1.json.gz.gpg), prazno = najnovejsa. Tako agent preizkusi obnovo katerekoli kopije, ne da bi geslo
# kdaj zapustilo GitHub. Obnova v PRODUKCIJO ni del tega workflowa (SKILL obnova-baze, samo z Martinovim DA).
#
# V javnem dnevniku: imena tabel in OK/NAPAKA, nikoli stevila vrstic, podatki ali ime/ID racuna R2.
name: Preizkus kopije (mesecni)

on:
  schedule:
    - cron: "41 6 1 * *"
  workflow_dispatch:
    inputs:
      kopija:
        description: "Ime ali kljuc kopije (outly-db-YYYY-MM-DD-r<stevilke>.json.gz.gpg); prazno = najnovejsa"
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  preizkus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: kopije
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ciljna baza: SAMO service container na runnerju (nikoli produkcija).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outly
      NODE_ENV: test
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      VNOS_KOPIJA: ${{ github.event.inputs.kopija || '' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Namesti odvisnosti
        run: |
          set -euo pipefail
          npm ci
          gpg --version | head -n1

      - name: Izberi kopijo v R2
        id: izbor
        run: |
          set -euo pipefail
          bash _orodja/kopija/r2.sh list "kopije/20" \
            | grep -E $'^kopije/[0-9]{4}/[0-9]{2}/outly-db-[0-9-]+-r[0-9]+(-[0-9]+)?\\.json\\.gz\\.gpg\t' \
            | sort -t$'\t' -k2,2r > kopije.tsv || true
          ST=$(grep -c . kopije.tsv || true)
          echo "Kopij v R2: $ST"
          if [ "$ST" -eq 0 ]; then echo "::error::V R2 ni nobene kopije."; exit 1; fi
          if [ -n "$VNOS_KOPIJA" ]; then
            # vnos je lahko le ime ali kljuc kopije (preverba pred uporabo, ni ukaz)
            IME_VNOS="${VNOS_KOPIJA##*/}"
            if ! [[ "$IME_VNOS" =~ ^outly-db-[0-9]{4}-[0-9]{2}-[0-9]{2}-r[0-9]+(-[0-9]+)?\.json\.gz\.gpg$ ]]; then
              echo "::error::Polje kopija ni videti kot ime kopije."; exit 1
            fi
            KLJUC=$(cut -f1 kopije.tsv | grep -F "/$IME_VNOS" | head -n1 || true)
            if [ -z "$KLJUC" ]; then echo "::error::Take kopije ni v R2."; exit 1; fi
            NASTALA=$(grep -F "$KLJUC" kopije.tsv | head -n1 | cut -f2)
          else
            KLJUC=$(head -n1 kopije.tsv | cut -f1)
            NASTALA=$(head -n1 kopije.tsv | cut -f2)
          fi
          IME="${KLJUC##*/}"
          STAROST_H=$(( ( $(date -u +%s) - $(date -u -d "$NASTALA" +%s) ) / 3600 ))
          echo "Izbrana: $IME, nastala $NASTALA (pred $STAROST_H h)"
          { echo "KLJUC=$KLJUC"; echo "IME=$IME"; } >> "$GITHUB_ENV"
          [ "$ST" -ge 20 ] || echo "::warning::V R2 je samo $ST kopij (po enem mesecu delovanja pricakovano ~30)."
          # svezina velja le za »najnovejsa«; izrecno izbrana kopija je lahko poljubno stara
          if [ -z "$VNOS_KOPIJA" ] && [ "$STAROST_H" -gt 50 ]; then
            echo "::error::Najnovejsa kopija je stara $STAROST_H h (dovoljeno 50): dnevna kopija ne nastaja."; exit 1
          fi

      - name: Prenesi in preveri celovitost
        run: |
          set -euo pipefail
          mkdir -p kopija
          bash _orodja/kopija/r2.sh get "$KLJUC" "kopija/$IME"
          bash _orodja/kopija/r2.sh get "$KLJUC.sha256" "kopija/$IME.sha256"
          ( cd kopija && sha256sum -c "$IME.sha256" )
          if grep -q -a '"exported_at"' "kopija/$IME"; then echo "::error::Kopija vsebuje golo besedilo!"; exit 1; fi
          [ "$(stat -c %s "kopija/$IME")" -gt 1000 ] || { echo "::error::Kopija je sumljivo majhna."; exit 1; }
          echo "Celovitost (sha256): OK"

      - name: Odsifriraj z BACKUP_GESLO
        env:
          BACKUP_GESLO: ${{ secrets.BACKUP_GESLO }}
        run: bash _orodja/kopija/odsifriraj.sh "kopija/$IME" "$RUNNER_TEMP/izvoz.json"

      - name: Obnovi v prazno bazo (service container postgres:16) in primerjaj
        run: bash _orodja/kopija/preizkus_obnove.sh "$RUNNER_TEMP/izvoz.json"

      - name: Povzetek
        run: |
          echo "Mesecni preizkus obnove: kopija \`$IME\` je odsifrirana, obnovljena v prazno bazo in se ujema (tabele, migracije)." >> "$GITHUB_STEP_SUMMARY"

      - name: Pocisti golo besedilo z diska runnerja
        if: always()
        run: rm -rf "$RUNNER_TEMP/izvoz.json" kopija || true

      - name: Rdec zagon - push (ntfy) in issue
        if: failure()
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TOPIC" ]; then
            curl -sS --max-time 20 -H "Title: Outly varnostna kopija" -H "Priority: high" -H "Tags: rotating_light" -H "Click: $RUN_URL" \
              -d "Mesecni preizkus obnove kopije baze je PADEL (kopija se ne da odsifrirati ali obnoviti). Preveri zagon." "https://ntfy.sh/$TOPIC" >/dev/null && echo "Push poslan." || true
          else
            echo "NTFY_TOPIC ni nastavljen - push preskocen"
          fi
          NASLOV="Preizkus obnove kopije baze je padel ($(date -u +%Y-%m))"
          ODPRT=$(gh issue list -R "$REPO" --state open --label agent --json title --jq '[.[] | select(.title | startswith("Preizkus obnove kopije baze je padel"))] | length' || echo 0)
          if [ "$ODPRT" -gt 0 ]; then echo "Issue ze obstaja (odprt) - novega ne odpiram."; exit 0; fi
          cat > telo.md <<TELO
          Mesecni polni preizkus obnove kopije iz R2 je padel. Zagon: $RUN_URL

          Kopije v R2 so lahko neuporabne. Postopek diagnoze: \`.claude/skills/obnova-baze/SKILL.md\`, razdelek »Ce dnevna kopija pade« in »Obnova v novo bazo«.
          Najprej preveri: je \`BACKUP_GESLO\` v environmentu \`kopije\` enak gesli, s katerim so bile kopije zasifrirane (menjava gesla!), ali je padla obnova (nova migracija).
          Po popravku zagon ponovi (Actions > Preizkus kopije (mesecni) > Run workflow) in dopisi vrstico v \`docs/INCIDENTI.md\`.
          TELO
          gh issue create -R "$REPO" --title "$NASLOV" --label agent --body-file telo.md
