# Testi backenda ob vsakem PR-ju in potisku na main.
# Dvigne PostgreSQL 16 (isti glavni razlicici kot produkcija, Render outly-db), pozene vse migracije na prazni bazi in nato testne skripte.
# Rdec zagon = PR se ne sme zdruziti (zascita veje main zahteva ta check).
name: Testi

on:
  pull_request:
  push:
    branches: [main]

# Testi berejo samo kodo repozitorija (checkout, npm ci, Postgres na runnerju): drugih pravic GITHUB_TOKEN ne rabijo.
permissions:
  contents: read

jobs:
  testi:
    # Pin na ubuntu-24.04, NE ubuntu-latest: GitHub "latest" postopno seli na 26.04, kjer je PostgreSQL 18 (9. 11. 2026: SQLSTATE 23001
    # namesto 23503 v test_razpored.js, main je bil rdec brez spremembe kode). Rezultat testov ne sme biti odvisen od slike runnerja.
    runs-on: ubuntu-24.04
    # 25 min: na ubuntu-24.04 testi trajajo ~15 min (PR #418: 14 min 51 s; #416 job 129069193633 je presegel 15 min).
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outly
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 16 je ze na runnerju (ubuntu-24.04: "PostgreSQL service is disabled by default"), zato slike ne prenasamo:
      # 9. 10. je Docker Hub, 12. 10. pa se AWS-ovo javno zrcalo vrnilo "toomanyrequests" in test je padel pred prvim testom.
      - name: PostgreSQL 16 (nameščen na runnerju, brez prenosa slike)
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb -E UTF8 -T template0 outly
          psql "$DATABASE_URL" -Atc "select version(), current_setting('server_encoding')"
      # Varovalo: testi morajo teci na isti glavni razlicici kot produkcija. Druga razlicica = rdec zagon z jasnim vzrokom,
      # ne pa tiha selitev, ki spremeni SQLSTATE-e in sporocila napak (glej 9. 11. 2026).
      - name: Preveri, da je PostgreSQL 16
        run: |
          v=$(psql "$DATABASE_URL" -Atc "show server_version_num")
          echo "server_version_num=$v"
          case "$v" in
            16????) ;;
            *) echo "::error::PostgreSQL ni 16 (server_version_num=$v); produkcija je 16. Runner: ${ImageOS:-?} ${ImageVersion:-?}"; exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migracije na prazni bazi
        run: npm run migrate
      - name: Migracije so idempotentne (drugi zagon nic ne spremeni)
        run: npm run migrate:stanje
      - name: Testi
        run: npm test
