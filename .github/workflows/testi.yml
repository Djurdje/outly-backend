# Testi backenda ob vsakem PR-ju in potisku na main.
# Dvigne PostgreSQL 16, pozene vse migracije na prazni bazi in nato testne skripte.
# Rdec zagon = PR se ne sme zdruziti (zascita veje main zahteva ta check).
name: Testi

on:
  pull_request:
  push:
    branches: [main]

# Testi berejo samo kodo repozitorija (checkout, npm ci, Postgres na runnerju): drugih pravic GITHUB_TOKEN ne rabijo.
permissions:
  contents: read

jobs:
  testi:
    # Pripeto na ubuntu-24.04 (PostgreSQL 16 = produkcija outly-db). 9. 11. 2026 je ubuntu-latest postal ubuntu-26.04 s PostgreSQL 18.6:
    # PG 18 krsitev ON DELETE RESTRICT javi kot 23001 namesto 23503 in test_razpored.js je padel na main brez spremembe kode.
    # Ob nadgradnji produkcijske baze spremeni runner IN spodnjo pricakovano razlicico skupaj.
    runs-on: ubuntu-24.04
    # 25 min: na ubuntu-24.04 cel npm test (110 skript) traja ~15,5 min (9. 11. 2026); 15 je bilo tik pod robom (PR-ji pred tem 14 min).
    timeout-minutes: 25
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outly
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 16 je ze na runnerju (ubuntu-24.04: "PostgreSQL service is disabled by default"), zato slike ne prenasamo:
      # 9. 10. je Docker Hub, 12. 10. pa se AWS-ovo javno zrcalo vrnilo "toomanyrequests" in test je padel pred prvim testom.
      - name: PostgreSQL 16 (nameščen na runnerju, brez prenosa slike)
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -h localhost -p 5432 && break; sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb -E UTF8 -T template0 outly
          psql "$DATABASE_URL" -Atc "select version(), current_setting('server_encoding')"
          glavna=$(psql "$DATABASE_URL" -Atc "select current_setting('server_version_num')::int / 10000")
          if [ "$glavna" != "16" ]; then
            echo "::error::PostgreSQL na runnerju je $glavna, produkcija je 16 - testi bi preverjali drugo razlicico baze (popravi runs-on)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migracije na prazni bazi
        run: npm run migrate
      - name: Migracije so idempotentne (drugi zagon nic ne spremeni)
        run: npm run migrate:stanje
      - name: Testi
        run: npm test
