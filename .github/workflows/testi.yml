# Testi backenda ob vsakem PR-ju in potisku na main.
# Dvigne PostgreSQL 16, pozene vse migracije na prazni bazi in nato testne skripte.
# Rdec zagon = PR se ne sme zdruziti (zascita veje main zahteva ta check).
name: Testi

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outly
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migracije na prazni bazi
        run: npm run migrate
      - name: Migracije so idempotentne (drugi zagon nic ne spremeni)
        run: npm run migrate:stanje
      - name: Testi
        run: npm test
